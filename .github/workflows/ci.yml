name: Frontend CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  quality-and-build:
    name: Lint, Test & Build (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🛡️ Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Run Unit Tests (Vitest)
        run: npx vitest run

      - name: 🏗️ Build Production Next.js App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
